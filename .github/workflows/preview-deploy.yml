name: PR Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cloudflare-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Skip fork PRs where repository secrets are unavailable
    if: github.event.pull_request.head.repo.fork == false
    steps:
      - name: Check Cloudflare credentials
        id: check_secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets not configured; skipping PR preview deployment cleanly."
          fi

      - name: Check out source
        if: steps.check_secrets.outputs.enabled == 'true'
        uses: actions/checkout@v7

      - name: Set up Node.js
        if: steps.check_secrets.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        if: steps.check_secrets.outputs.enabled == 'true'
        run: npm ci

      - name: Build OpenNext bundle and upload preview version
        id: upload_preview
        if: steps.check_secrets.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SITE_URL: https://codestation.in
          SITE_INDEXING: ''
        run: |
          npx @opennextjs/cloudflare build
          npx wrangler versions upload --preview-alias "pr-${{ github.event.pull_request.number }}" 2>&1 | tee wrangler-upload.log
          PREVIEW_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' wrangler-upload.log | head -n 1 || true)
          if [ -z "$PREVIEW_URL" ]; then
            echo "Could not parse Wrangler preview URL from upload output."
            exit 1
          fi
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Verify Cloudflare preview Worker runtime & headers
        if: steps.check_secrets.outputs.enabled == 'true'
        env:
          PREVIEW_URL: ${{ steps.upload_preview.outputs.preview_url }}
          EXPECTED_INDEXING: ''
          EXPECTED_ORIGIN: https://codestation.in
        run: npm run cf:verify
