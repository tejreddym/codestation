name: Bug Report
description: Report a bug, UI glitch, or incorrect calculation in Code Station or codestation-mcp
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! Please check that it hasn't already been reported.
        For security vulnerabilities, do **not** open a public issue — please see [SECURITY.md](SECURITY.md).

  - type: input
    id: tool_or_area
    attributes:
      label: Affected Tool, Station, or Package
      description: e.g. `/tools/json-formatter`, `video-trimmer`, `pdf-compressor`, Homepage, or `codestation-mcp`
      placeholder: "/tools/video-trimmer"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact steps and sample inputs (please sanitize any sensitive data) to reproduce the behavior.
      value: |
        1. Go to '...'
        2. Enter / upload '...'
        3. Click '...'
        4. Observe error
    validations:
      required: true

  - type: textarea
    id: expected_vs_actual
    attributes:
      label: Expected vs. actual behavior
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, theme (light/dark), and Node/npm version if running locally or using `codestation-mcp`.
      placeholder: |
        - OS: macOS 15
        - Browser: Chrome 134
        - Node.js (if local): 22.19.0
    validations:
      required: false
